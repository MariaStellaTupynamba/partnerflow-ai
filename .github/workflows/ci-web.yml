name: CI - Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-web.yml"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Type-check
        run: npm run typecheck --workspace apps/web

      - name: Unit tests
        run: npm run test --workspace apps/web

      - name: Build
        run: npm run build --workspace apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    # apps/web/e2e/auth.spec.ts exercises the real register/login/dashboard flow against a
    # live backend — it isn't mocked — so this job needs the API and a database running,
    # same as ci-api.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partnerflow
          POSTGRES_PASSWORD: partnerflow-ci-password
          POSTGRES_DB: partnerflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partnerflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://partnerflow:partnerflow-ci-password@localhost:5432/partnerflow
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
      AI_PROVIDER_API_KEY: ""
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Start backend
        working-directory: apps/api
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Install Playwright browsers
        run: npx --workspace apps/web playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e --workspace apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
